name: Construir APK de Vinilo

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      # opcional, se puede usar si alguna tarea lo necesita
      ANDROID_SDK_ROOT: /usr/local/android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Android SDK (build-tools + platform)
        uses: android-actions/setup-sdk@v2
        with:
          api-levels: 33
          components: build-tools;33.0.2,platforms;android-33

      - name: Ensure Gradle 8.13 is available on runner
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.13'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Update Gradle wrapper to 8.13 (in-run)
        run: ./gradlew wrapper --gradle-version 8.13 --distribution-type bin

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Build APK (release)
        run: ./gradlew assembleRelease --no-daemon
