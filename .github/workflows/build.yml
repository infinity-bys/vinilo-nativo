name: Compilar Vinilo nativo

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: |
          test -f proyecto.zip
          rm -rf proyecto
          mkdir proyecto
          unzip -q proyecto.zip -d proyecto
          ls proyecto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Compilar la app
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Vinilo-nativo-debug
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
