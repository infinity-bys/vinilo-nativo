name: Extraer proyecto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto en el repositorio
        run: |
          test -f proyecto.zip
          unzip -o -q proyecto.zip
          rm proyecto.zip
          ls

      - name: Guardar los archivos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Proyecto nativo: fase 1 (base, lista de musica y reproduccion)"
          git push
